modifications:
  # Case 1: internal_power (Type 2) + WHERE (Type 3) + fall_power (Type 1)
  - scope:
      path:
        - library: "*"
        - cell: "AND3x1_ASAP7_6t_SL"
        - pin: "A"
        - internal_power:
            WHERE:
              when: "(B * !C * !Y)"
              related_pg_pin: "VDD"
        - fall_power: "passive_power_template_7x1_x1"
    action:
      operation: add
      mode: broadcast
      value: 0.01
  # Case 2: timing (Type 2) + WHERE (Type 3) + cell_fall (Type 1) + matrix
  - scope:
      path:
        - library: "*"
        - cell: "AND2x2_ASAP7_6t_SL"
        - pin: "Y"
        - timing:
            WHERE:
              related_pin: "A"
        - cell_fall: "delay_template_7x7_x1"
    action:
      operation: add
      mode: matrix
      value:
        - [0.01, 0, 0, 0, 0, 0, 0]
        - [0, 0.01, 0, 0, 0, 0, 0]
        - [0, 0, 0.01, 0, 0, 0, 0]
        - [0, 0, 0, 0.01, 0, 0, 0]
        - [0, 0, 0, 0, 0.01, 0, 0]
        - [0, 0, 0, 0, 0, 0.01, 0]
        - [0, 0, 0, 0, 0, 0, 0.01]
